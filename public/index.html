<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn — Private Messages</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 16px system-ui, sans-serif;
      color: #20251f;
      background: #f2f3ee;
    }

    main {
      width: min(680px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
    }

    h1 { margin: 0; letter-spacing: -0.04em; }
    .subtitle { margin: 4px 0 20px; color: #62685e; }

    .panel, #chat {
      background: white;
      border: 1px solid #dfe2d9;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 28px #24301b0b;
    }

    label { display: block; margin: 14px 0 6px; font-weight: 600; }

    input, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #c9cec2;
      border-radius: 10px;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #78927d;
      border-color: transparent;
    }

    button {
      margin-top: 12px;
      border: 0;
      color: white;
      background: #385b43;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: #2c4b36; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .note, #join-status, #status {
      font-size: 14px;
      line-height: 1.5;
      color: #62685e;
    }

    #join-status { color: #9b3e31; }
    #chat { flex: 1; margin-top: 16px; min-height: 300px; }
    #verification {
      padding: 12px;
      background: #f2f3ee;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    #messages {
      height: min(45vh, 400px);
      overflow-y: auto;
      padding: 0;
      list-style: none;
    }

    #messages li { padding: 10px 0; border-bottom: 1px solid #eee; }
    .meta { color: #62685e; font-size: 13px; }

    #send-form { display: flex; gap: 8px; }
    #send-form input { flex: 1; min-width: 0; }
    #send-form button { width: auto; margin: 0; }

    .verify-check {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 12px 0;
      font-weight: 400;
    }

    .verify-check input {
      width: auto;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cairn</h1>
    <p class="subtitle">A two-person encrypted chat demo.</p>

    <section class="panel" id="join-panel">
      <label for="name">Your display name</label>
      <input id="name" maxlength="24" placeholder="e.g. Alex"
             autocomplete="nickname">

      <label for="room">Room code</label>
      <input id="room" maxlength="40" placeholder="e.g. weekend-chat"
             autocomplete="off" autocapitalize="none" spellcheck="false">

      <p class="note">
        Both people enter the same room code. There is no shared encryption key
        to type in. After joining, compare the verification code using a separate
        trusted channel, such as a phone call.
      </p>

      <p id="join-status" aria-live="polite"></p>
      <button id="join-button" type="button">Join room</button>
    </section>

    <section id="chat" hidden>
      <p id="status" aria-live="polite">Connecting…</p>

      <div id="verification-area" hidden>
        <p><strong>Compare this code with the other person:</strong></p>
        <p id="verification" aria-live="polite"></p>
        <label class="verify-check">
          <input id="verified" type="checkbox">
          <span>We compared the codes over a separate trusted channel, and they match.</span>
        </label>
      </div>

      <ul id="messages" aria-live="polite"></ul>

      <form id="send-form">
        <input id="message-input" maxlength="1000" placeholder="Write a message"
               autocomplete="off" aria-label="Message" disabled>
        <button id="send-button" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const joinPanel = document.querySelector("#join-panel");
    const joinStatus = document.querySelector("#join-status");
    const chat = document.querySelector("#chat");
    const status = document.querySelector("#status");
    const verificationArea = document.querySelector("#verification-area");
    const verification = document.querySelector("#verification");
    const verifiedCheckbox = document.querySelector("#verified");
    const messages = document.querySelector("#messages");
    const messageInput = document.querySelector("#message-input");
    const sendButton = document.querySelector("#send-button");

    let room = "";
    let displayName = "";
    let privateKey = null;
    let ownPublicKeyText = "";
    let peerPublicKeyText = "";
    let sessionKey = null;

    function bytesToBase64Url(bytes) {
      let binary = "";
      for (const byte of bytes) {
        binary += String.fromCharCode(byte);
      }

      return btoa(binary)
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/g, "");
    }

    function base64UrlToBytes(value) {
      const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
      const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
      return Uint8Array.from(atob(padded), character => character.charCodeAt(0));
    }

    function updateSendControls() {
      const canSend = Boolean(sessionKey && verifiedCheckbox.checked);
      messageInput.disabled = !canSend;
      sendButton.disabled = !canSend;
    }

    function showMessage(name, text, time = new Date().toISOString()) {
      const item = document.createElement("li");
      const meta = document.createElement("div");
      const body = document.createElement("div");

      meta.className = "meta";
      meta.textContent = `${name} · ${new Date(time).toLocaleTimeString()}`;
      body.textContent = text;

      item.append(meta, body);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    async function handlePeerPublicKey(publicKeyText) {
      if (typeof publicKeyText !== "string" || publicKeyText.length > 300) {
        status.textContent = "Received an invalid public key.";
        return;
      }

      if (publicKeyText === ownPublicKeyText) return;

      peerPublicKeyText = publicKeyText;

      try {
        const peerPublicKey = await crypto.subtle.importKey(
          "raw",
          base64UrlToBytes(peerPublicKeyText),
          { name: "ECDH", namedCurve: "P-256" },
          false,
          []
        );

        const secretBits = await crypto.subtle.deriveBits(
          { name: "ECDH", public: peerPublicKey },
          privateKey,
          256
        );

        const hkdfKey = await crypto.subtle.importKey(
          "raw",
          secretBits,
          "HKDF",
          false,
          ["deriveKey"]
        );

        sessionKey = await crypto.subtle.deriveKey(
          {
            name: "HKDF",
            hash: "SHA-256",
            salt: new TextEncoder().encode(room),
            info: new TextEncoder().encode("Cairn demo v1")
          },
          hkdfKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );

        const publicKeys = [ownPublicKeyText, peerPublicKeyText].sort();
        const fingerprintText = `${room}|${publicKeys[0]}|${publicKeys[1]}`;
        const fingerprintDigest = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(fingerprintText)
        );

        const code = Array.from(new Uint8Array(fingerprintDigest).slice(0, 8))
          .map(byte => byte.toString(16).padStart(2, "0"))
          .join("")
          .toUpperCase();

        verification.textContent = code;
        verificationArea.hidden = false;
        status.textContent =
          "Compare the code with the other person. Sending stays disabled until you confirm the codes match.";
        updateSendControls();
      } catch (error) {
        sessionKey = null;
        status.textContent = "Key exchange failed. Refresh and try again.";
        console.error(error);
      }
    }

    document.querySelector("#join-button").addEventListener("click", async () => {
      displayName = document.querySelector("#name").value.trim().slice(0, 24);
      room = document.querySelector("#room").value.trim().toLowerCase();
      joinStatus.textContent = "";

      if (!displayName) {
        joinStatus.textContent = "Enter a display name.";
        return;
      }

      if (!/^[a-z0-9-]{3,40}$/.test(room)) {
        joinStatus.textContent =
          "Room code must be 3–40 lowercase letters, numbers, or hyphens.";
        return;
      }

      if (!window.crypto || !crypto.subtle) {
        joinStatus.textContent =
          "Browser encryption is unavailable. Open the Render site using HTTPS.";
        return;
      }

      if (typeof io !== "function") {
        joinStatus.textContent =
          "Could not load the chat connection library. Check the server and refresh.";
        return;
      }

      try {
        const keyPair = await crypto.subtle.generateKey(
          { name: "ECDH", namedCurve: "P-256" },
          true,
          ["deriveBits"]
        );

        privateKey = keyPair.privateKey;
        const publicKeyBytes = await crypto.subtle.exportKey("raw", keyPair.publicKey);
        ownPublicKeyText = bytesToBase64Url(new Uint8Array(publicKeyBytes));

        joinPanel.hidden = true;
        chat.hidden = false;
        status.textContent = "Joining room…";

        if (!socket.connected) {
          status.textContent = "Connecting to the server…";
          socket.connect();
        }

        socket.emit("join-room", { room });
        socket.emit("public-key", ownPublicKeyText);
      } catch (error) {
        joinPanel.hidden = false;
        chat.hidden = true;
        joinStatus.textContent = "Could not create encryption keys. Refresh and try again.";
        console.error(error);
      }
    });

    verifiedCheckbox.addEventListener("change", () => {
      updateSendControls();
      if (verifiedCheckbox.checked) {
        status.textContent = "Code confirmed. You can send encrypted messages.";
      }
    });

    socket.on("peer-public-key", handlePeerPublicKey);

    socket.on("room-error", message => {
      joinPanel.hidden = false;
      chat.hidden = true;
      joinStatus.textContent = message;
    });

    socket.on("connect_error", () => {
      status.textContent = "Could not connect to the server. Refresh and try again.";
    });

    socket.on("disconnect", () => {
      sessionKey = null;
      verifiedCheckbox.checked = false;
      updateSendControls();

      if (!chat.hidden) {
        status.textContent =
          "Disconnected. Refresh and rejoin to start a new session.";
      }
    });

    socket.on("peer-left", () => {
      sessionKey = null;
      peerPublicKeyText = "";
      verifiedCheckbox.checked = false;
      verificationArea.hidden = true;
      updateSendControls();
      status.textContent =
        "The other person left. Refresh and rejoin to start a new session.";
    });

    document.querySelector("#send-form").addEventListener("submit", async event => {
      event.preventDefault();

      if (!sessionKey || !verifiedCheckbox.checked) {
        status.textContent = "Compare and confirm the verification code first.";
        return;
      }

      const text = messageInput.value.trim();
      if (!text) return;

      try {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const plaintext = new TextEncoder().encode(
          JSON.stringify({ name: displayName, text })
        );

        const ciphertext = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          sessionKey,
          plaintext
        );

        socket.emit("send-message", {
          iv: bytesToBase64Url(iv),
          data: bytesToBase64Url(new Uint8Array(ciphertext))
        });

        showMessage("You", text);
        messageInput.value = "";
        messageInput.focus();
      } catch (error) {
        status.textContent = "Could not encrypt the message.";
        console.error(error);
      }
    });

    socket.on("message", async packet => {
      if (!sessionKey) return;

      try {
        const plaintext = await crypto.subtle.decrypt(
          {
            name: "AES-GCM",
            iv: base64UrlToBytes(packet.iv)
          },
          sessionKey,
          base64UrlToBytes(packet.data)
        );

        const message = JSON.parse(new TextDecoder().decode(plaintext));
        showMessage(message.name, message.text, packet.time);
      } catch (error) {
        status.textContent = "Could not decrypt the message.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
